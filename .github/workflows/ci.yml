name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build MelaninWoundCdss.slnx -c Release
      - run: dotnet test MelaninWoundCdss.slnx -c Release --no-build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes ajv-cli@5 validate --spec=draft2020 -s contracts/wound-event.schema.json -d "contracts/examples/wound-event.*.valid.json"

  mobile:
    runs-on: ubuntu-latest
    if: hashFiles('mobile/pubspec.yaml') != ''
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
