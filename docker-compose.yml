# Local prototype stack (architecture §14). One machine, single Kafka broker.
#
#   docker compose up -d --build                       whole backend in containers
#   docker compose up -d kafka postgres kafka-ui       infrastructure only (run services with `dotnet run`)
#   docker compose --profile tools up -d               + Toxiproxy, OpenTelemetry, Prometheus, Grafana
#
# Start-up order: kafka + postgres → kafka-init (topics) + db-migrate (schemas, seed, demo users) → services.
name: melanin-wound-cdss

x-backend: &backend
  build: &backend-build
    context: .
    dockerfile: backend/Dockerfile
  restart: unless-stopped
  environment: &backend-env
    ConnectionStrings__Postgres: "Host=postgres;Username=${POSTGRES_USER:-cdss};Password=${POSTGRES_PASSWORD:-cdss};Database=${POSTGRES_DB:-cdss}"
    Kafka__BootstrapServers: "kafka:9092"
  depends_on: &backend-deps
    db-migrate:
      condition: service_completed_successfully
    kafka-init:
      condition: service_completed_successfully

services:
  # ---- Infrastructure -------------------------------------------------------------------------

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "29092:29092"          # host access: localhost:29092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Demo only: replication factor 1. Do not claim durability under broker loss (§8.2).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cdss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdss}
      POSTGRES_DB: ${POSTGRES_DB:-cdss}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cdss}"]
      interval: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on: [kafka]

  # ---- One-shot setup jobs --------------------------------------------------------------------

  # Topics from §8.1 (same list as infra/kafka/create-topics.sh). Safe to run again.
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        t() { /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$1" --partitions "$$2" --replication-factor 1; }
        t wound-events 6
        t wound-events.persisted 6
        t recommendations.ready 3
        t wound-events.retry.30s 3
        t wound-events.retry.5m 3
        t wound-events.dlq 1
    restart: "no"

  # Applies db/migrations, the local-dev seed (facility fac-001, device dev-a41c), and demo users.
  # Demo users are for local development only; create-clinician skips a username that already exists.
  db-migrate:
    <<: *backend
    build:
      <<: *backend-build
      args:
        PROJECT: backend/tools/db-migrator/DbMigrator.csproj
        ENTRY: DbMigrator.dll
    image: melanin-wound-cdss/db-migrator
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--seed"]

  seed-demo-users:
    <<: *backend
    image: melanin-wound-cdss/identity-service
    build:
      <<: *backend-build
      args:
        PROJECT: backend/apps/identity-service/IdentityService.csproj
        ENTRY: IdentityService.dll
    restart: "no"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    entrypoint: ["sh", "-c"]
    command:
      - |
        dotnet IdentityService.dll create-clinician admin.demo Demo-Admin-2026! admin fac-001 Demo Admin || true
        dotnet IdentityService.dll create-clinician n.silva Demo-Pass-2026! nurse fac-001 N. Silva || true

  # ---- Member 4 backend units (§4) ------------------------------------------------------------

  # The only public port (ADR 0004). Routes /v1/auth, /v1/admin, /.well-known -> identity-service and
  # /v1/sync, /v1/patients, /v1/figures, /v1/baseline, /health -> sync-gateway.
  api-gateway:
    <<: *backend
    image: melanin-wound-cdss/api-gateway
    build:
      <<: *backend-build
      args:
        PROJECT: backend/apps/api-gateway/ApiGateway.csproj
        ENTRY: ApiGateway.dll
    ports:
      - "8080:8080"
    environment:
      Jwt__MetadataAddress: "http://identity-service:8080/.well-known/openid-configuration"
      ReverseProxy__Clusters__identity__Destinations__d1__Address: "http://identity-service:8080/"
      ReverseProxy__Clusters__sync__Destinations__d1__Address: "http://sync-gateway:8080/"
    depends_on:
      - identity-service
      - sync-gateway

  # Issues and signs every token (ADR 0003); other services fetch its public keys from /.well-known/jwks.json.
  # Reached only through the api-gateway.
  identity-service:
    <<: *backend
    image: melanin-wound-cdss/identity-service
    build:
      <<: *backend-build
      args:
        PROJECT: backend/apps/identity-service/IdentityService.csproj
        ENTRY: IdentityService.dll
    environment:
      <<: *backend-env
      # Local development values. Without Jwt__SigningKeyPem a key is generated at start-up (restart = devices refresh).
      Jwt__SigningKeyPem: ${Jwt__SigningKeyPem:-}
      Secrets__EncryptionKey: ${Secrets__EncryptionKey:-local-dev-only-encryption-key-change-me-0123456}
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  sync-gateway:
    <<: *backend
    image: melanin-wound-cdss/sync-gateway
    build:
      <<: *backend-build
      args:
        PROJECT: backend/apps/sync/sync-gateway/SyncGateway.csproj
        ENTRY: SyncGateway.dll
    environment:
      <<: *backend-env
      Jwt__MetadataAddress: "http://identity-service:8080/.well-known/openid-configuration"
    depends_on:
      <<: *backend-deps
      identity-service:
        condition: service_started

  ingest-persister:
    <<: *backend
    image: melanin-wound-cdss/ingest-persister
    build:
      <<: *backend-build
      args:
        PROJECT: backend/apps/sync/ingest-persister/IngestPersister.csproj
        ENTRY: IngestPersister.dll

  outbox-relay:
    <<: *backend
    image: melanin-wound-cdss/outbox-relay
    build:
      <<: *backend-build
      args:
        PROJECT: backend/apps/sync/outbox-relay/OutboxRelay.csproj
        ENTRY: OutboxRelay.dll

  orchestrator:
    <<: *backend
    image: melanin-wound-cdss/orchestrator
    build:
      <<: *backend-build
      args:
        PROJECT: backend/apps/sync/orchestrator/Orchestrator.csproj
        ENTRY: Orchestrator.dll
    environment:
      <<: *backend-env
      RecommendationService__BaseUrl: "http://rag-stub:8080"

  # Stand-in for Member 3's Recommendation Service until the real one is ready (§13.1).
  rag-stub:
    image: melanin-wound-cdss/rag-stub
    build:
      <<: *backend-build
      args:
        PROJECT: backend/tests/rag-stub/RagStub.csproj
        ENTRY: RagStub.dll
    restart: unless-stopped
    ports:
      - "5080:8080"
    environment:
      STUB_DELAY_MS: ${STUB_DELAY_MS:-0}
      STUB_FAIL_MODE: ${STUB_FAIL_MODE:-none}

  # ---- Optional: fault injection and observability ----------------------------------------------
  # These mount config files from infra/, so Docker Desktop must be allowed to share this drive.

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    profiles: [tools]
    ports:
      - "8474:8474"            # Toxiproxy API
      - "18080:18080"          # device simulator -> toxiproxy -> sync gateway
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./infra/toxiproxy:/config:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    profiles: [tools]
    command: ["--config=/etc/otel/otel-collector-config.yaml"]
    ports:
      - "4317:4317"            # OTLP gRPC
      - "4318:4318"            # OTLP HTTP
    volumes:
      - ./infra/otel-collector:/etc/otel:ro

  prometheus:
    image: prom/prometheus:v2.55.0
    profiles: [tools]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [tools]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  kafka-data:
  postgres-data:
