# Local prototype stack (architecture §14). One machine, single Kafka broker.
# The .NET services run with `dotnet run` during development; containers for them come later.
name: melanin-wound-cdss

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "29092:29092"          # host access: localhost:29092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Demo only: replication factor 1. Do not claim durability under broker loss (§8.2).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cdss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdss}
      POSTGRES_DB: ${POSTGRES_DB:-cdss}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cdss}"]
      interval: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on: [kafka]

  # ---- Optional: fault injection and observability ----------------------------------------
  # Start with: docker compose --profile tools up -d
  # These mount config files from infra/, so Docker Desktop must be allowed to share this drive.

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    profiles: [tools]
    ports:
      - "8474:8474"            # Toxiproxy API
      - "18080:18080"          # device simulator -> toxiproxy -> sync gateway
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./infra/toxiproxy:/config:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    profiles: [tools]
    command: ["--config=/etc/otel/otel-collector-config.yaml"]
    ports:
      - "4317:4317"            # OTLP gRPC
      - "4318:4318"            # OTLP HTTP
    volumes:
      - ./infra/otel-collector:/etc/otel:ro

  prometheus:
    image: prom/prometheus:v2.55.0
    profiles: [tools]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [tools]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  kafka-data:
  postgres-data:
