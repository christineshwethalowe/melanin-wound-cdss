server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The app is static; everything it needs from the backend goes to the API gateway (ADR 0004).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Entry points change on every build: always revalidate so a new release is picked up.
    location ~ ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
